; AnotAI Lapela — PlatformIO para Seeed Studio XIAO BLE Sense (nRF52840)
; https://wiki.seeedstudio.com/XIAO_BLE/
;
; A plataforma oficial `nordicnrf52` NÃO inclui a XIAO, então usamos o fork
; comunitário de maxgerhardt (núcleo Arduino estilo Adafruit, onde a
; ArduinoBLE funciona — a plataforma da Seeed quebra o ArduinoBLE com
; "Unsupported board selected!").

[env:seeed_xiao_ble_sense]
platform = https://github.com/maxgerhardt/platform-nordicnrf52
framework = arduino
board = xiaoblesense
board_build.core = arduino
monitor_speed = 115200
monitor_filters = time
upload_protocol = nrfutil
lib_deps =
  arduino-libraries/ArduinoBLE@^1.4.1
; O LDF puxa a Portenta_Audio (só p/ Cortex-M7) por causa do PDM.h;
; seus ldflags quebram o link no nRF52840 (Cortex-M4) — ignorar é seguro.
lib_ignore =
  Portenta_Audio
