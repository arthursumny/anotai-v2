# AnotAI web — Nginx servindo dist/ e repassando /api/* para o container api.
#
# `api` é resolvido pela network interna do compose. Tudo fora de /api/ cai em
# SPA fallback (index.html) — necessário para o react-router-dom não quebrar em
# deep-links. Tamanho máximo do body do upload é 25 MB (bate com MAX_AUDIO_MB=25).

server {
  listen 80 default_server;
  server_name _;
  client_max_body_size 25m;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  location = /health {
    proxy_pass http://api:8000/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;

    # Não compor access log com URL completa — o caminho do webhook embute
    # segredos; mantenha a cargo do proxy reverso de borda (Dokploy) redigir.
    proxy_pass_request_headers on;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  location /assets/ {
    root /app;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  location / {
    root /app;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
