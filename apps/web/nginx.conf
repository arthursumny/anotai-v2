# AnotAI web — Nginx servindo dist/ e repassando /api/* para a API.
#
# `anotai-api` é um alias exclusivo na rede privada do compose, evitando colisão
# com outros serviços `api` na rede compartilhada do Dokploy. Tudo fora de /api/
# cai em SPA fallback (index.html) para suportar deep-links. Upload: 25 MB.

server {
  listen 80 default_server;
  server_name _;
  client_max_body_size 25m;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  location = /health {
    proxy_pass http://anotai-api:8000/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api/ {
    proxy_pass http://anotai-api:8000;
    proxy_http_version 1.1;

    # Não compor access log com URL completa — o caminho do webhook embute
    # segredos; mantenha a cargo do proxy reverso de borda (Dokploy) redigir.
    proxy_pass_request_headers on;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  location /assets/ {
    root /app;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  location / {
    root /app;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
